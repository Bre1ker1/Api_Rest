<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Turnos Médicos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <!-- Formulario -->
    <div class="card">
      <h2>Agendar Nuevo Turno</h2>
      <form id="turnoForm">
        <div class="form-group">
          <label for="paciente">Paciente</label>
          <input type="text" id="paciente" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
          <label for="medico">Médico / Especialidad</label>
          <select id="medico" required>
            <option value="">Seleccione un médico</option>
          </select>
        </div>

        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
          <label for="hora">Hora Disponible</label>
          <select id="hora" required>
            <option value="">Seleccione fecha y médico primero</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Agendar Turno</button>
      </form>
    </div>

    <!-- Lista de Turnos -->
    <div class="card">
      <h2>Turnos Registrados</h2>
      <div id="listaTurnos" class="turnos-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
